# Hermetic ITree Differential Trace Suite Manifest (`tests/itree-diff/manifest.toml`)
#
# Maps each of the 30 curated seed functions in `tests/itree-diff/corpus/src/lib.rs`
# to its category, inlined helpers (`inlined_callees`), external callees (`ext_callees`),
# metamorphic check policy (`check_inline_vs_ext_duality`), and expected verdict.

[suite]
name = "anneal-itree-diff-v1"
crate_name = "itree_diff_corpus"
min_category_1_to_5_pass_rate = 1.0
min_overall_pass_rate = 0.966
default_step_fuel = 128

# ---------------------------------------------------------------------------
# Category 1: Multi-argument scalar & bitwise functions (5)
# ---------------------------------------------------------------------------

[[tests.pass]]
name = "clamp_u32_range"
category = "cat1_scalar_bitwise"
inlined_callees = []
ext_callees = []

[[tests.pass]]
name = "rotate_xor_mix"
category = "cat1_scalar_bitwise"
inlined_callees = []
ext_callees = []

[[tests.pass]]
name = "checked_affine_step"
category = "cat1_scalar_bitwise"
inlined_callees = []
ext_callees = []

[[tests.pass]]
name = "signed_abs_diff"
category = "cat1_scalar_bitwise"
inlined_callees = []
ext_callees = []

[[tests.pass]]
name = "bitfield_extract"
category = "cat1_scalar_bitwise"
inlined_callees = []
ext_callees = []

