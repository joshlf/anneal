#     - https://github.com/rust-lang/miri (subtree `tests`)
#   Pinned rustc / Miri commit: 14210df0e27ccd7d9e6a05b8085cbd438e4bbc65
#                               (rustc 1.98.0-nightly 2026-05-31)
#
# POLICY ON `known_anneal_bug` ENTRIES (READ CAREFULLY):
#   Every `[tests.known_anneal_bug]` block in this manifest documents an
#   UNFIXED BUG in Anneal's MIR-in-Lean operational semantics
#   (`Trusted.Rustc.V2026_06_01.MirSemantics`) or MIR capture pipeline.
#
#   These disagreements are bugs in Anneal, NOT "disagreements we have decided
#   to admit permanently". They are recorded solely as a two-way regression
#   ratchet:
#     1. Every test WITHOUT `known_anneal_bug` must agree 100% between Miri
#        and Anneal (`TotalVerificationResult` for `pass`,
#        `verifySafePanicMirPointBounded` for `panic`, and
#        `refuteMirPointByStrictUB` for `ub`, which rejects `FailureKind.unsupported`).
#     2. Every test WITH `known_anneal_bug` is checked against its exact
#        `observed_anneal_tag` in the Lean 4 kernel. When an Anneal bug is fixed,
#        the `known_anneal_bug` theorem fails to type-check until the entry is
#        removed from this manifest, ratcheting the open bug count down toward 0.

