name: Codex review diagnostics

'on':
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONS_CACHE_URL: ''
      ACTIONS_RESULTS_URL: ''
      ACTIONS_RUNTIME_TOKEN: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Dispatch refs must not select code that receives the read token.
          ref: refs/heads/main
          persist-credentials: false
      - name: Inspect proposed Code Review verdicts without publishing
        env:
          GH_TOKEN: ${{ github.token }}
        # Isolated Python ignores user site packages and PYTHONPATH. The default
        # mode reads GitHub data and prints verdicts without writing statuses.
        run: python3 -I -B ci/codex_review.py
