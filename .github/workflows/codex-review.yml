name: Codex review gate

'on':
  # The write-capable evaluator must use reviewed code, even for a fork PR.
  # Never change this to check out or execute a pull request's head revision.
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - closed
      - ready_for_review
      - converted_to_draft
  issue_comment:
    types: [created, edited, deleted]
  # Reconcile existing PRs when the adapter itself lands or changes on main.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The output is shared by commits, including commits used in several PRs.
# Serialize the whole repository, not individual PRs. Each retained run reads
# every open PR, so replacing a pending run does not lose that run's event.
concurrency:
  group: codex-review-gate
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    env:
      ACTIONS_CACHE_URL: ''
      ACTIONS_RESULTS_URL: ''
      ACTIONS_RUNTIME_TOKEN: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This branch is the policy owner. Event refs and dispatch refs must
          # not select the executable code that receives the status token.
          ref: refs/heads/main
          persist-credentials: false
      - name: Publish the current Code Review verdicts
        env:
          GH_TOKEN: ${{ github.token }}
        # Isolated Python ignores user site packages and PYTHONPATH. PR text is
        # read through the API as data; it never becomes a command or a path.
        run: python3 -I -B ci/codex_review.py --publish
