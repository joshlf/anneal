name: Trusted boundary

"on":
  # GHerrit stacks target other PR branches as well as main. Retargeting also
  # changes the merge tree, so edited events must receive a real check.
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: trusted-boundary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trusted-boundary:
    # Keep this name stable: repository merge protection selects this context.
    name: Trusted boundary
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the proposed merge tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Provision the pinned Lean release
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          anneal_lean_dir="$RUNNER_TEMP/anneal-lean"
          anneal_archive="$anneal_lean_dir/lean-4.34.1-darwin_aarch64.tar.zst"
          mkdir -p "$anneal_lean_dir" "$RUNNER_TEMP/anneal-trusted-logs"
          curl --fail --location --silent --show-error \
            --connect-timeout 20 --max-time 300 --retry 2 --retry-max-time 300 \
            --output "$anneal_archive" \
            https://github.com/leanprover/lean4/releases/download/v4.34.1/lean-4.34.1-darwin_aarch64.tar.zst
          printf '%s  %s\n' \
            65f22a4f047738ec742667b3247e836a86ebf06eabc12655c3dee00637e37866 \
            "$anneal_archive" | shasum --algorithm 256 --check
          tar -xf "$anneal_archive" -C "$anneal_lean_dir"
          "$anneal_lean_dir/lean-4.34.1-darwin_aarch64/bin/lean" --version

      - name: Check Trusted containment, statement-origin separation, and Cargo DAG
        env:
          TMPDIR: ${{ runner.temp }}/anneal-trusted-logs
        run: |
          python3 -B trusted/audit/check_trusted.py \
            --lean "$RUNNER_TEMP/anneal-lean/lean-4.34.1-darwin_aarch64/bin/lean"

      - name: Test the boundary checker and regression fixtures
        env:
          TMPDIR: ${{ runner.temp }}/anneal-trusted-logs
        run: |
          python3 -B trusted/audit/check_trusted.py --self-test \
            --lean "$RUNNER_TEMP/anneal-lean/lean-4.34.1-darwin_aarch64/bin/lean"

      - name: Check Rust workspace compilation
        run: |
          cargo check --workspace --locked

      - name: Verify clean working tree
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Preserve failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trusted-boundary-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/anneal-trusted-logs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
          compression-level: 1
