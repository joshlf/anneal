name: Codex review events

'on':
  pull_request_target:
    types: [opened, synchronize, reopened, edited, closed, ready_for_review,
            converted_to_draft]
  merge_group:
    types: [checks_requested]

# This workflow only creates a workflow_run notification on the default branch.
# It has no checkout, environment, secrets, or write permissions. The publisher
# independently reads live GitHub state; this run supplies no approval evidence.
permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - run: 'true'
