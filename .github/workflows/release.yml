name: Anneal Release

'on':
  push:
    branches:
      - main
    paths:
      - 'trusted/cargo-anneal/Cargo.toml'
  workflow_dispatch:
    inputs:
      version:
        description: 'cargo-anneal version to release'
        required: true
      branch:
        description: 'Branch to update'
        required: true
        default: 'main'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check-version:
    name: Check if version was updated
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.repository == 'joshlf/anneal' && github.event_name != 'workflow_dispatch'
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Determine if version was updated
        id: check
        run: |
          set -eo pipefail
          CUR_VER=$(cargo metadata -q --format-version 1 | jq -r '.packages[] | select(.name == "cargo-anneal").version')

          git checkout -q HEAD^
          PREV_VER=$(cargo metadata -q --format-version 1 | jq -r '.packages[] | select(.name == "cargo-anneal").version')
          git checkout -q -

          if [ "$CUR_VER" != "$PREV_VER" ]; then
            echo "Version change detected: $PREV_VER -> $CUR_VER"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$CUR_VER" >> "$GITHUB_OUTPUT"
          else
            echo "Version unchanged ($CUR_VER)."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Release to crates.io and GitHub
    needs: check-version
    if: needs.check-version.outputs.changed == 'true' && github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Smoke-test remote exocrate toolchain installation
        run: |
          set -eo pipefail
          cargo run --locked -p cargo-anneal -- setup
          cargo test --workspace --locked

      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Publish cargo-anneal
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -eo pipefail
          cargo publish -p cargo-anneal --registry crates-io

      - name: Create git tag
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eo pipefail
          TAG="v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "$TAG"

      - name: Create GitHub Release
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          TAG="v$VERSION"
          gh release create "$TAG" --generate-notes

  create-release:
    name: Create toolchain artifact release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      base_sha: ${{ steps.tag.outputs.base_sha }}
      tag_name: ${{ steps.tag.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.branch }}
          persist-credentials: false

      - name: Create draft release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version }}
          GH_REPO: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -eo pipefail
          BASE_SHA="$(git rev-parse HEAD)"
          SHORT_BASE_SHA="${BASE_SHA:0:12}"
          TAG_NAME="anneal-toolchains-v${VERSION}-${GITHUB_RUN_ID}-${SHORT_BASE_SHA}"
          gh release create "$TAG_NAME" \
            --repo "$GH_REPO" \
            --target "$BASE_SHA" \
            --title "$TAG_NAME" \
            --notes "Machine-generated Anneal toolchain artifacts for cargo-anneal ${VERSION}, built from ${BASE_SHA}." \
            --draft \
            --prerelease \
            --latest=false
          echo "base_sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

  publish-artifacts:
    name: Publish toolchain artifact (${{ matrix.target }})
    needs: create-release
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            nix_system: x86_64-linux
            cargo_os: linux
            cargo_arch: x86_64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
            nix_system: aarch64-linux
            cargo_os: linux
            cargo_arch: aarch64
          - os: macos-15
            target: macos-x86_64
            nix_system: x86_64-darwin
            cargo_os: macos
            cargo_arch: x86_64
          - os: macos-15
            target: macos-aarch64
            nix_system: aarch64-darwin
            cargo_os: macos
            cargo_arch: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.create-release.outputs.base_sha }}
          persist-credentials: false

      - name: Install Rosetta for Intel macOS builds
        if: matrix.nix_system == 'x86_64-darwin'
        run: sudo softwareupdate --install-rosetta --agree-to-license

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@e847f25223456b3058e12f7fc9d777b6a6f25060 # v3.23.2

      - name: Build and publish toolchain artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.create-release.outputs.tag_name }}
          TARGET: ${{ matrix.target }}
          NIX_SYSTEM: ${{ matrix.nix_system }}
          CARGO_OS: ${{ matrix.cargo_os }}
          CARGO_ARCH: ${{ matrix.cargo_arch }}
        run: |
          set -eo pipefail
          ARCHIVE_NAME="anneal-toolchain-${TARGET}.tar.zst"
          mkdir -p target/release-metadata

          nix build .#omnibus-archive-layout-check --system "$NIX_SYSTEM" --no-link
          nix build .#omnibus-archive --system "$NIX_SYSTEM" --out-link "target/link-${ARCHIVE_NAME}"
          cp -f "$(readlink -f "target/link-${ARCHIVE_NAME}")" "target/${ARCHIVE_NAME}"
          rm -f "target/link-${ARCHIVE_NAME}"

          gh release upload "$TAG_NAME" "target/${ARCHIVE_NAME}" --repo "$GH_REPO" --clobber

          sha256="$(sha256sum "target/${ARCHIVE_NAME}" | awk '{print $1}')"
          url="https://github.com/${GH_REPO}/releases/download/${TAG_NAME}/${ARCHIVE_NAME}"
          jq -n \
            --arg os "$CARGO_OS" \
            --arg arch "$CARGO_ARCH" \
            --arg sha256 "$sha256" \
            --arg url "$url" \
            '{os: $os, arch: $arch, sha256: $sha256, url: $url}' \
            > "target/release-metadata/${TARGET}.json"

      - name: Upload toolchain metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anneal-toolchain-metadata-${{ matrix.target }}
          path: target/release-metadata/${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 1

  open-release-pr:
    name: Open Anneal release PR
    needs: [create-release, publish-artifacts]
    if: github.event_name == 'workflow_dispatch'
    permissions:
      actions: read
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.create-release.outputs.base_sha }}
          persist-credentials: false

      - name: Download toolchain metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: anneal-toolchain-metadata-*
          path: target/release-metadata
          merge-multiple: true

      - name: Update release manifest and verify packaging
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -eo pipefail
          python3 ci/update_release_manifest.py \
            --cargo-toml trusted/cargo-anneal/Cargo.toml \
            --version "$VERSION" \
            --metadata-dir target/release-metadata
          rm -rf target/release-metadata

          cargo update -p cargo-anneal --precise "$VERSION"
          cargo publish --dry-run -p cargo-anneal --allow-dirty

      - name: Create release pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "Release cargo-anneal ${{ github.event.inputs.version }}"
          title: "Release cargo-anneal ${{ github.event.inputs.version }}"
          base: ${{ github.event.inputs.branch }}
          branch: anneal-release-${{ github.event.inputs.version }}
          add-paths: |
            Cargo.lock
            trusted/cargo-anneal/Cargo.toml
          token: ${{ github.token }}

      - name: Publish toolchain artifact release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.create-release.outputs.tag_name }}
        run: |
          set -eo pipefail
          gh release edit "$TAG_NAME" --repo "$GH_REPO" --draft=false
