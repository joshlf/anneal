name: Build & Tests

# Quote this key so YAML 1.1 parsers do not interpret it as a boolean.
'on':
  push:
    branches:
      - main
      - unstable
  pull_request:
  merge_group:
  # Useful for manually testing changes to this workflow. Because we check for
  # the merge queue by doing `github.event_name != 'pull_request'` rather than
  # `github.event_name == 'merge_group'`, triggering via workflow dispatch has
  # the effect of running all jobs, including those which would normally only be
  # run in the merge queue.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-todo:
    runs-on: ubuntu-latest
    name: Check for todo comments
    steps:
      - name: Install ripgrep
        run: |
         sudo apt-get update
         sudo apt-get install ripgrep
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run todo check
        run: ./ci/check_todo.sh

  rust-unit-tests:
    runs-on: ubuntu-latest
    name: Rust workspace unit tests
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run workspace unit tests
        run: cargo test --workspace --lib --bins --locked

  tutor-chapters:
    # Replays the Anneal Tutor against the current `cargo-anneal` and fails when
    # a chapter quotes a command, report, error, or file that the tool no longer
    # produces (see docs/tutor/workflow/README.md). The fix is always to run
    # `python3 docs/tutor/workflow/tutor_workflow.py render` and commit the diff.
    name: Tutor chapters match the workflow
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same pinned release and checksum as .github/workflows/trusted-boundary.yml.
      - name: Provision the pinned Lean release
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          anneal_lean_dir="$RUNNER_TEMP/anneal-lean"
          anneal_archive="$anneal_lean_dir/lean-4.34.1-darwin_aarch64.tar.zst"
          mkdir -p "$anneal_lean_dir"
          curl --fail --location --silent --show-error \
            --connect-timeout 20 --max-time 300 --retry 2 --retry-max-time 300 \
            --output "$anneal_archive" \
            https://github.com/leanprover/lean4/releases/download/v4.34.1/lean-4.34.1-darwin_aarch64.tar.zst
          printf '%s  %s\n' \
            65f22a4f047738ec742667b3247e836a86ebf06eabc12655c3dee00637e37866 \
            "$anneal_archive" | shasum --algorithm 256 --check
          tar -xf "$anneal_archive" -C "$anneal_lean_dir"
          "$anneal_lean_dir/lean-4.34.1-darwin_aarch64/bin/lean" --version
          echo "$anneal_lean_dir/lean-4.34.1-darwin_aarch64/bin" >> "$GITHUB_PATH"

      # `cargo anneal` builds every `.anneal/` workspace through Lake's local
      # artifact cache, so the `Trusted` and `Anneal` libraries compile once per
      # cache rather than once per verified crate. Artifacts are content-
      # addressed, so a partial match from `restore-keys` still saves every
      # module whose inputs did not change.
      - name: Restore the Lake artifact cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/anneal-lake-cache
          key: lake-artifacts-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('trusted/lean/lean-toolchain', 'trusted/lean/**/*.lean', 'theory/**/*.lean') }}
          restore-keys: |
            lake-artifacts-${{ runner.os }}-${{ runner.arch }}-

      - name: Replay the tutor and check its rendered chapters
        env:
          LAKE: ${{ runner.temp }}/anneal-lean/lean-4.34.1-darwin_aarch64/bin/lake
          LAKE_CACHE_DIR: ${{ runner.temp }}/anneal-lake-cache
        run: |
          cargo test -p cargo-anneal --test end_to_end_tutor --locked

      - name: Verify clean working tree
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Preserve the step records of a failed replay
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tutor-workflow-records-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/tutor-workflow/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
          compression-level: 1

  end-to-end-verification:
    name: End-to-end pipeline & user journeys
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Provision the pinned Lean release
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          anneal_lean_dir="$RUNNER_TEMP/anneal-lean"
          anneal_archive="$anneal_lean_dir/lean-4.34.1-darwin_aarch64.tar.zst"
          mkdir -p "$anneal_lean_dir"
          curl --fail --location --silent --show-error \
            --connect-timeout 20 --max-time 300 --retry 2 --retry-max-time 300 \
            --output "$anneal_archive" \
            https://github.com/leanprover/lean4/releases/download/v4.34.1/lean-4.34.1-darwin_aarch64.tar.zst
          printf '%s  %s\n' \
            65f22a4f047738ec742667b3247e836a86ebf06eabc12655c3dee00637e37866 \
            "$anneal_archive" | shasum --algorithm 256 --check
          tar -xf "$anneal_archive" -C "$anneal_lean_dir"
          "$anneal_lean_dir/lean-4.34.1-darwin_aarch64/bin/lean" --version
          echo "$anneal_lean_dir/lean-4.34.1-darwin_aarch64/bin" >> "$GITHUB_PATH"

      - name: Restore the Lake artifact cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/anneal-lake-cache
          key: lake-artifacts-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('trusted/lean/lean-toolchain', 'trusted/lean/**/*.lean', 'theory/**/*.lean') }}
          restore-keys: |
            lake-artifacts-${{ runner.os }}-${{ runner.arch }}-

      - name: Run end-to-end pipeline and demo user journeys
        env:
          LAKE: ${{ runner.temp }}/anneal-lean/lean-4.34.1-darwin_aarch64/bin/lake
          LAKE_CACHE_DIR: ${{ runner.temp }}/anneal-lake-cache
        run: |
          cargo test -p cargo-anneal --test end_to_end_pipeline --locked
          cargo test -p cargo-anneal --test end_to_end_demo_journeys --locked

      - name: Verify clean working tree
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"

  # Used to signal to branch protections that all other jobs have succeeded.
  all-jobs-succeed:
      # WARNING: This name is load-bearing! It's how GitHub's settings UI configures which jobs
      # to block on. DO NOT change this name without updating the settings UI to match.
      name: All checks succeeded (ci.yml)
      # Run even when a dependency fails, is skipped, or is cancelled, then
      # inspect every result explicitly. A skipped required check counts as
      # success in branch protection, so this aggregation must fail closed.
      if: ${{ always() }}
      runs-on: ubuntu-latest
      needs: [check-todo, rust-unit-tests, tutor-chapters, end-to-end-verification]
      steps:
        - name: Reject workflow cancellation
          if: ${{ cancelled() }}
          run: exit 1

        - name: Require every dependency to succeed
          env:
            NEEDS_JSON: ${{ toJSON(needs) }}
          run: |
            set -euo pipefail
            jq -e '
              type == "object" and length > 0 and
              all(
                to_entries[];
                .value.result == "success"
              )
            ' <<< "$NEEDS_JSON"
