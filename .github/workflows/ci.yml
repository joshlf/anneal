name: Build & Tests

# Quote this key so YAML 1.1 parsers do not interpret it as a boolean.
'on':
  push:
    branches:
      - main
  pull_request:
  merge_group:
  # Useful for manually testing changes to this workflow. Because we check for
  # the merge queue by doing `github.event_name != 'pull_request'` rather than
  # `github.event_name == 'merge_group'`, triggering via workflow dispatch has
  # the effect of running all jobs, including those which would normally only be
  # run in the merge queue.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    name: Static checks
    # Strip GitHub Actions cache and artifact service credentials so scripts in
    # `ci/` (outside `trusted/`) cannot poison workflow caches or artifacts.
    env:
      ACTIONS_CACHE_URL: ''
      ACTIONS_RESULTS_URL: ''
      ACTIONS_RUNTIME_TOKEN: ''
    steps:
      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@e847f25223456b3058e12f7fc9d777b6a6f25060 # v3.23.2
      - name: Run todo check
        run: ./ci/check_todo.sh
      - name: Run job dependency check
        run: ./ci/check_job_dependencies.sh
      - name: Run GitHub Actions validator
        run: ./ci/check_actions.sh
      - name: Check Nix flake evaluation across all platforms
        run: ./ci/check_flake_eval.sh

  build-exocrate:
    runs-on: ubuntu-latest
    name: Build exocrate toolchain archive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify root TCB manifest
        run: |
          set -euo pipefail
          sha256sum --check --strict trusted/root-manifest.sha256
          for p in .cargo rust-toolchain rust-toolchain.toml; do
            test ! -e "$p" && test ! -L "$p"
          done

      - name: Restore Nix binary cache
        id: restore_nix_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/nix-cache
          key: anneal-nix-cache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'Cargo.lock', 'trusted/lean/**', 'trusted/audit/**', 'trusted/rustc-capture/**', 'theory/**') }}

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@e847f25223456b3058e12f7fc9d777b6a6f25060 # v3.23.2

      - name: Build omnibus toolchain archive
        run: |
          set -euo pipefail
          mkdir -p target
          nix_args=()
          if [ -f target/nix-cache/nix-cache-info ]; then
            nix_args+=(--extra-substituters "file://$PWD/target/nix-cache/?trusted=1")
          fi

          nix build "${nix_args[@]}" .#omnibus-archive --out-link target/omnibus-link
          cp -f "$(readlink -f target/omnibus-link)" target/anneal-exocrate.tar.zst
          rm -f target/omnibus-link

      - name: Populate Nix binary cache
        if: steps.restore_nix_cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p target/nix-cache
          nix copy .#omnibus-archive \
            --to "file://$PWD/target/nix-cache/?compression=zstd&compression-level=1&trusted=1"

      - name: Save Nix binary cache
        if: steps.restore_nix_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/nix-cache
          key: ${{ steps.restore_nix_cache.outputs.cache-primary-key }}

      - name: Upload exocrate toolchain archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anneal-exocrate-archive
          path: target/anneal-exocrate.tar.zst
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  test-and-verify:
    runs-on: ubuntu-latest
    name: Toolchain setup & workspace tests
    needs: [build-exocrate]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify root TCB manifest
        run: |
          set -euo pipefail
          sha256sum --check --strict trusted/root-manifest.sha256
          for p in .cargo rust-toolchain rust-toolchain.toml; do
            test ! -e "$p" && test ! -L "$p"
          done

      - name: Download exocrate toolchain archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: anneal-exocrate-archive
          path: target

      - name: Install exocrate toolchain from local archive
        run: |
          cargo run --locked -p cargo-anneal -- setup \
            --local-archive target/anneal-exocrate.tar.zst
          rm -f target/anneal-exocrate.tar.zst

      - name: Audit repository trusted boundary
        run: |
          cargo run --locked -p anneal-audit

      - name: Test Rust workspace and crate packaging
        run: |
          cargo test --workspace --locked
          cargo publish --dry-run -p cargo-anneal

      - name: Verify clean working tree
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"

  # Used to signal to branch protections that all other jobs have succeeded.
  all-jobs-succeed:
      # WARNING: This name is load-bearing! It's how GitHub's settings UI configures which jobs
      # to block on. DO NOT change this name without updating the settings UI to match.
      name: All checks succeeded (ci.yml)
      # Run even when a dependency fails, is skipped, or is cancelled, then
      # inspect every result explicitly. A skipped required check counts as
      # success in branch protection, so this aggregation must fail closed.
      if: ${{ always() }}
      runs-on: ubuntu-latest
      needs: [static-checks, build-exocrate, test-and-verify]
      steps:
        - name: Reject workflow cancellation
          if: ${{ cancelled() }}
          run: exit 1

        - name: Require every dependency to succeed
          env:
            NEEDS_JSON: ${{ toJSON(needs) }}
          run: |
            set -euo pipefail
            jq -e '
              type == "object" and length > 0 and
              all(
                to_entries[];
                .value.result == "success"
              )
            ' <<< "$NEEDS_JSON"
