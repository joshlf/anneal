# ==============================================================================
# Anneal <-> MiniRust Formal Non-Correspondence Registry & Two-Way Bug Ratchet
# ==============================================================================
#
# Policy:
#   Every entry in this file declares one of four mutually exclusive classes:
#     1. `anneal_soundness_bug`         - Anneal steps where MiniRust raises UB or disagrees on value
#     2. `anneal_false_positive_ub`     - Anneal conservatively raises UB where MiniRust steps cleanly
#     3. `anneal_unmodeled_feature`     - Anneal emits unsupported/externalCall for an unmodeled feature
#     4. `intentional_epoch_divergence` - Documented semantic delta between pinned rustc and newer MiniRust
#
#   Nothing in `lake build`, `cargo test`, `minirust-sync`, or default CI ever files
#   GitHub issues automatically. Issue formatting/filing is strictly opt-in via
#   `cargo anneal correspondence-bugs`.

schema_version = 1
github_repo = "joshlf/anneal"
default_labels = ["source:minirust-correspondence", "area:mir-semantics"]
max_open_bugs = 4

[[gaps]]
id = "GAP-MR-0001"
kind = "anneal_soundness_bug"
severity = "P1"
status = "open"
title = "Shared borrow (`BorrowKind.shared`) over `UnsafeCell` freezes permission instead of preserving interior mutability"
