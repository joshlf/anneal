[package]
name = "anneal-mir-instrument"
version = "0.1.0"
edition = "2024"
description = "Untrusted rustc driver for binary-level MIR trace instrumentation in Anneal."
license = "BSD-2-Clause OR Apache-2.0 OR MIT"
repository = "https://github.com/joshlf/anneal"
publish = false

[lib]
name = "anneal_mir_instrument"
path = "src/lib.rs"

[[bin]]
name = "anneal-mir-instrument"
path = "src/main.rs"

[dependencies]

[package.metadata.rust-analyzer]
rustc_private = true
