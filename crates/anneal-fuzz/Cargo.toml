[package]
name = "anneal-fuzz"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
arbitrary = { version = "1.4.2", features = ["derive"] }
arbtest = "0.3.2"
syn = { version = "2.0.119", features = ["full", "visit", "visit-mut", "extra-traits"] }
quote = "1.0.47"
prettyplease = "0.2.37"
proc-macro2 = "1.0.107"

[[bin]]
name = "miri-fuzz"
path = "src/bin/miri_fuzz.rs"

[[bin]]
name = "itree-fuzz"
path = "src/bin/itree_fuzz.rs"

[workspace]
