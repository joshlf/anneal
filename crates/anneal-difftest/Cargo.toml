[package]
name = "anneal-difftest"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
arbitrary = { version = "1.4.2", features = ["derive"] }
arbtest = "0.3.2"
syn = { version = "2.0.119", features = ["full", "visit", "visit-mut", "extra-traits"] }
quote = "1.0.47"
prettyplease = "0.2.37"
proc-macro2 = "1.0.107"

[[bin]]
name = "miri-difftest"
path = "src/bin/miri_difftest.rs"

[[bin]]
name = "itree-difftest"
path = "src/bin/itree_difftest.rs"

[workspace]
