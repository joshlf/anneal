[package]
name = "anneal-difftest"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anneal-trace = { path = "../anneal-trace" }
arbitrary = { version = "1.4.2", features = ["derive"] }
arbtest = "0.3.2"
cargo-anneal = { path = "../cargo-anneal" }
syn = { version = "2.0.119", features = ["full", "visit", "visit-mut", "extra-traits"] }
quote = "1.0.47"
prettyplease = "0.2.37"
# `span-locations` gives parsed items line numbers, which `miri_eval` uses to
# locate the evaluated function in a staged `src/lib.rs`.
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }

[[bin]]
name = "miri-difftest"
path = "src/bin/miri_difftest.rs"

[[bin]]
name = "itree-difftest"
path = "src/bin/itree_difftest.rs"

[workspace]
