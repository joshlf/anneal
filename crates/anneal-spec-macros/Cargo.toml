[package]
name = "anneal-spec-macros"
version = "0.1.0-alpha.1"
edition = "2024"
description = "Procedural macro implementation for Anneal specification attributes."
license = "BSD-2-Clause OR Apache-2.0 OR MIT"
repository = "https://github.com/joshlf/anneal"
publish = false

[lib]
proc-macro = true

[dependencies]
anodized-core = "0.7.0"
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "visit-mut"] }
