[package]
name = "cargo-anneal"
version = "0.1.0-alpha.1"
edition = "2024"
description = "Formally verify Rust programs in Lean 4."
license = "BSD-2-Clause OR Apache-2.0 OR MIT"
repository = "https://github.com/joshlf/anneal"
default-run = "cargo-anneal"
autobins = false
publish = true

[[bin]]
name = "cargo-anneal"
path = "src/main.rs"
